services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_memory}
      POSTGRES_USER: ${POSTGRES_USER:-memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - memory_db_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-memory} -d ${POSTGRES_DB:-agent_memory}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  memory-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-memory}:${POSTGRES_PASSWORD:-memory}@db:5432/${POSTGRES_DB:-agent_memory}
      MEMORY_OWNER_ID: ${MEMORY_OWNER_ID:-local-user}
      MEMORY_API_KEY: ${MEMORY_API_KEY:-}
      MAX_MEMORY_CONTENT_CHARS: ${MAX_MEMORY_CONTENT_CHARS:-12000}
      MAX_CHECKPOINT_CONTENT_CHARS: ${MAX_CHECKPOINT_CONTENT_CHARS:-12000}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-2}
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    command: ["npm", "start"]

volumes:
  memory_db_data:
